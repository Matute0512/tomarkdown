name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Usa el packageManager declarado en frontend/package.json (pnpm@10.34.5).
          # Fijar version: 9 instalaba pnpm 9, que exige un campo `packages` en
          # pnpm-workspace.yaml y fallaba con "packages field missing or empty".
          package_json_file: ./frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Linting (ESLint)
        run: pnpm lint

      - name: Build Next.js
        # Garantiza que la app compila correctamente
        run: pnpm build